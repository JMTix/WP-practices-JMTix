<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:ital,wght@0,100..900;1,100..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Price Per Hour</title>
  </head>
  <body>
    <header>
      <h1 class="title">Price Per Hour</h1>

      <p class="subtitle">Made by JMTix</p>
    </header>

    <p class="explanation">
      Use this simple calculator to multiply a price by a quantity of hours!
    </p>

    <main class="main-hero">
      <label for="price">Price:</label>
      <input type="number" id="price" name="price" placeholder="Enter price" />

      <label for="hours">Hours:</label>
      <input type="number" id="hours" name="hours" placeholder="Enter hours" />

      <label for="discount">Discount:</label>
      <input
        type="number"
        id="discount"
        name="discount"
        placeholder="Enter discount(optional)"
      />

      <button name="Submit" id="submit">Submit</button>
    </main>

    <section class="result-section">
      <h2 class="result-text">Result:</h2>

      <div class="result-container">
        <p id="result"></p>
      </div>
    </section>
    <script src="script.js"></script>
  </body>
</html>
